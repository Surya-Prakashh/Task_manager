<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGradient)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#glow)" />
  
  <!-- Checkmark Badge & List Icon Graphic -->
  <g transform="translate(116, 116)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Checklist items -->
    <line x1="120" y1="50" x2="260" y2="50" opacity="0.9" />
    <line x1="120" y1="140" x2="260" y2="140" opacity="0.9" />
    <line x1="120" y1="230" x2="200" y2="230" opacity="0.9" />
    
    <!-- Big dynamic checkmark -->
    <path d="M20 140 L60 180 L130 90" stroke="#a7f3d0" stroke-width="32" />
    <circle cx="50" cy="50" r="16" fill="#ffffff" fill-opacity="0.25" stroke="none" />
    <circle cx="50" cy="230" r="16" fill="#ffffff" fill-opacity="0.25" stroke="none" />
  </g>
</svg>
